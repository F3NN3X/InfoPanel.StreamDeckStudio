<!doctype html>
<html>
	<head lang="en">
		<title>Sensor dial</title>
		<meta charset="utf-8" />
		<script src="sdpi-components.js"></script>
	</head>

	<body>
		<sdpi-item label="Find">
			<sdpi-textfield setting="sensorFilter" placeholder="Type to narrow the list"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Sensor">
			<sdpi-select setting="sensor" datasource="getSensors" loading="Loading..." placeholder="Select a sensor" hot-reload show-refresh></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Label">
			<sdpi-textfield setting="label" placeholder="Sensor name"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Unit">
			<sdpi-textfield setting="unit" placeholder="From the sensor"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Decimals">
			<sdpi-textfield setting="decimals" placeholder="Auto"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Bar max">
			<sdpi-textfield setting="barMax" placeholder="100 for % and °"></sdpi-textfield>
		</sdpi-item>
		<sdpi-heading>Colours</sdpi-heading>
		<sdpi-item label="Warn at">
			<sdpi-textfield setting="warn" placeholder="e.g. 70"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Critical at">
			<sdpi-textfield setting="crit" placeholder="e.g. 90"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Lower is worse">
			<sdpi-checkbox setting="invert"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-heading>On press</sdpi-heading>
		<sdpi-item label="Open page">
			<sdpi-select setting="page" datasource="getPages" loading="Loading..." placeholder="None" hot-reload show-refresh></sdpi-select>
		</sdpi-item>
		<sdpi-item label="Profile">
			<sdpi-select setting="profile" datasource="getProfiles" loading="Loading..." placeholder="Shown profile" hot-reload show-refresh></sdpi-select>
		</sdpi-item>
		<sdpi-heading>Connection</sdpi-heading>
		<sdpi-item label="Studio">
			<sdpi-textfield setting="studioUrl" global placeholder="http://127.0.0.1:3922"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Data API">
			<sdpi-textfield setting="dataApiUrl" global placeholder="http://127.0.0.1:3921"></sdpi-textfield>
		</sdpi-item>
	</body>
</html>
