name: Release Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

# Third-party code (npm lifecycle scripts, actions) runs in the build job, so only the release job can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      date: ${{ steps.get_date.outputs.DATE }}

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Test
      run: npm test

    - name: Build Plugin
      run: npm run build

    - name: Validate Plugin
      run: npm run validate

    - name: Get Version from Project
      id: get_version
      shell: pwsh
      run: |
        $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
        $manifest = Get-Content "com.f3nn3x.infopanel-studio.sdPlugin/manifest.json" -Raw | ConvertFrom-Json
        echo "package.json version: '$version', manifest Version: '$($manifest.Version)'"
        if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Error "Could not find version in package.json"
            exit 1
        }
        # Stream Deck formats the manifest version as X.Y.Z.W
        if ($manifest.Version -ne "$version.0") {
            Write-Error "manifest.json Version $($manifest.Version) does not match package.json version $version (expected $version.0)"
            exit 1
        }
        echo "VERSION=$version" >> $env:GITHUB_OUTPUT

    - name: Check tag matches version
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        REF_NAME: ${{ github.ref_name }}
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        if ($env:REF_NAME -ne "v$env:VERSION") {
            Write-Error "Tag $env:REF_NAME does not match package.json version $env:VERSION"
            exit 1
        }

    - name: Package Plugin
      run: npm run pack -- --force --no-update-check

    - name: Upload artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: com.f3nn3x.infopanel-studio-v${{ steps.get_version.outputs.VERSION }}
        path: com.f3nn3x.infopanel-studio.streamDeckPlugin

    - name: Get Current Date
      id: get_date
      shell: pwsh
      run: echo "DATE=$(Get-Date -Format 'yyyy-MM-dd')" >> $env:GITHUB_OUTPUT

    - name: Extract Release Notes
      shell: pwsh
      env:
        VERSION: ${{ steps.get_version.outputs.VERSION }}
      run: |
        $version = $env:VERSION
        $notes = @()
        if (Test-Path "CHANGELOG.md") {
            $recording = $false
            foreach ($line in (Get-Content "CHANGELOG.md")) {
                if ($line -match "^## \[?v?$([regex]::Escape($version))\]?") { $recording = $true; continue }
                if ($recording -and $line -match "^## ") { break }
                if ($recording) { $notes += $line }
            }
        }
        $body = ($notes -join "`n").Trim()
        if ([string]::IsNullOrWhiteSpace($body)) { $body = "InfoPanel Studio Stream Deck plugin v$version. Open the .streamDeckPlugin file to install." }
        Set-Content -Path "release_notes.md" -Value $body

    - name: Upload release notes
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-notes
        path: release_notes.md

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download plugin
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: com.f3nn3x.infopanel-studio-v${{ needs.build.outputs.version }}

    - name: Download release notes
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-notes

    - name: Create GitHub Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: com.f3nn3x.infopanel-studio.streamDeckPlugin
        body_path: release_notes.md
        name: "v${{ needs.build.outputs.version }} - ${{ needs.build.outputs.date }}"
        draft: false
        prerelease: false
